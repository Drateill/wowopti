name: Test, build & deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  # Les noms d'image GHCR doivent être en minuscules.
  IMAGE: ghcr.io/drateill/wowopti

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build && npm run build:server
      - name: "Discord: tests failed"
        if: failure() && github.event_name == 'push'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MSG: "❌ Tests/build en échec pour `${{ github.repository }}` @ `${{ github.sha }}` — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          jq -n --arg c "$MSG" '{content:$c}' | curl -sf -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK" || true

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: "Discord: build started"
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MSG: "🔨 Build lancé pour `${{ github.repository }}` @ `${{ steps.vars.outputs.sha }}` (${{ github.actor }})"
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          jq -n --arg c "$MSG" '{content:$c}' | curl -sf -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK" || true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.IMAGE }}:latest
      - name: "Discord: image pushed"
        if: success()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MSG: "📦 Image poussée sur GHCR : `${{ env.IMAGE }}:${{ steps.vars.outputs.sha }}`"
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          jq -n --arg c "$MSG" '{content:$c}' | curl -sf -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK" || true
      - name: "Discord: build failed"
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MSG: "❌ Build/push en échec pour `${{ github.repository }}` @ `${{ steps.vars.outputs.sha }}` — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          jq -n --arg c "$MSG" '{content:$c}' | curl -sf -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK" || true

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install yq
        run: |
          sudo curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Bump image tag in k8s/kustomization.yaml
        run: yq -i '(.images[] | select(.name == "${{ env.IMAGE }}").newTag) = "${{ needs.build-and-push.outputs.sha }}"' k8s/kustomization.yaml
      - name: Commit & push (ArgoCD synchronise ensuite)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --cached --quiet || git commit -m "deploy: image ${{ needs.build-and-push.outputs.sha }} [skip ci]"
          git push
      - name: "Discord: deploy triggered"
        if: success()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MSG: "🚀 Manifestes mis à jour sur `${{ needs.build-and-push.outputs.sha }}` — ArgoCD synchronise wowopti.drateil.ovh"
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          jq -n --arg c "$MSG" '{content:$c}' | curl -sf -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK" || true
